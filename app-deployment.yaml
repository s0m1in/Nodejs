# ==========================================
# 1. PGBOUNCER (原本的 mode: global)
# ==========================================
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: pgbouncer
  namespace: default
spec:
  selector:
    matchLabels:
      app: pgbouncer
  template:
    metadata:
      labels:
        app: pgbouncer
    spec:
      hostNetwork: true
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
      containers:
      - name: pgbouncer
        image: edoburu/pgbouncer:latest
        resources:
          limits:
            cpu: "1.0"
            memory: 256Mi
        securityContext:
          capabilities:
            add: ["SYS_RESOURCE"]
        volumeMounts:
        - name: config
          mountPath: /etc/pgbouncer/pgbouncer.ini
          subPath: pgbouncer.ini
        - name: users
          mountPath: /etc/pgbouncer/userlist.txt
          subPath: userlist.txt
      volumes:
      - name: config
        configMap:
          name: pgbouncer-config-v2
      - name: users
        secret:
          secretName: pgbouncer-users-v2
---
# ==========================================
# 2. REDIS (原本的 mode: global)
# ==========================================
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: redis
  namespace: default
spec:
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      hostNetwork: true 
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
      containers:
      - name: redis
        image: redis:7-alpine
        command: ["redis-server", "/etc/redis/redis.conf"]
        env:
        - name: TZ
          value: "Asia/Hong_Kong"
        volumeMounts:
        - name: config
          mountPath: /etc/redis/redis.conf
          subPath: redis.conf
        - name: tz
          mountPath: /etc/localtime
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: redis-config-v2
      - name: tz
        hostPath:
          path: /etc/localtime
---
# ==========================================
# 3. WAF (Caddy + Coraza，原本的 mode: global)
# ==========================================
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: waf
  namespace: default
spec:
  selector:
    matchLabels:
      app: waf
  template:
    metadata:
      labels:
        app: waf
    spec:
      hostNetwork: true # 聽在實體外網 80/8080 埠，精準保留真實 IP
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
      containers:
      - name: waf
        image: my-local-caddy-coraza:latest
        imagePullPolicy: Never
        resources:
          limits:
            cpu: "2.0"
            memory: 2Gi
          requests:
            cpu: "0.5"
            memory: 512Mi
        env:
        - name: TZ
          value: "Asia/Hong_Kong"
        volumeMounts:
        - name: config
          mountPath: /etc/caddy/Caddyfile
          subPath: Caddyfile
        - name: tz
          mountPath: /etc/localtime
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: caddy-config-v7
      - name: tz
        hostPath:
          path: /etc/localtime
---
# ==========================================
# 4. APP (正宗 K8s DaemonSet 模式，與 WAF 共享最高速主機平面)
# ==========================================
apiVersion: apps/v1
kind: DaemonSet # 👈 關鍵：強迫每台 Worker 必跑一套，自成獨立閉環
metadata:
  name: app
  namespace: default
spec:
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      hostNetwork: true # 👈 終極黃金通關：直接與 Caddy 共享主機網路，100% 免疫虛擬網卡卡死！
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist # 絕對不去 Master
      hostAliases:
      - ip: "127.0.0.1" 
        hostnames:
        - "postgres" 
        - "redis"
      containers:
      - name: app
        image: docker.io/library/new-app:latest 
        imagePullPolicy: Never                  
        resources:
          limits:
            cpu: "1"
            memory: 1Gi
          requests:
            cpu: 500m
            memory: 512Mi
        env:
        - name: TZ
          value: "Asia/Hong_Kong"
        - name: NODE_OPTIONS
          value: "--max-old-space-size=768"
        - name: NODE_ENV
          value: "production"
        - name: REDIS_HOST
          value: "redis"
        - name: REDIS_PORT
          value: "6379"
        - name: REDIS_DB
          value: "0"
        - name: HOST
          value: "127.0.0.1" # 👈 專家級修正：鎖死在 127.0.0.1！外網實體網路絕對摸不到 3000，只有同機 WAF 能連！
        - name: PORT
          value: "3000"
        readinessProbe:
          exec:
            command: ["/nodejs/bin/node", "-e", "require('net').createConnection(3000, '127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
          periodSeconds: 10
          timeoutSeconds: 3
        volumeMounts:
        - name: env-file
          mountPath: /app/.env 
          subPath: env_v1
        - name: tz
          mountPath: /etc/localtime
          readOnly: true
      volumes:
      - name: env-file
        secret:
          secretName: env-v6
      - name: tz
        hostPath:
          path: /etc/localtime
