# ==========================================
# 1. PGBOUNCER (原本的 mode: global)
# ==========================================
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: pgbouncer
  namespace: default
spec:
  selector:
    matchLabels:
      app: pgbouncer
  template:
    metadata:
      labels:
        app: pgbouncer
    spec:
      hostNetwork: true
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
      containers:
      - name: pgbouncer
        image: edoburu/pgbouncer:latest
        resources:
          limits:
            cpu: "1.0"
            memory: 256Mi
        securityContext:
          capabilities:
            add: ["SYS_RESOURCE"]
        volumeMounts:
        - name: config
          mountPath: /etc/pgbouncer/pgbouncer.ini
          subPath: pgbouncer.ini
        - name: users
          mountPath: /etc/pgbouncer/userlist.txt
          subPath: userlist.txt
      volumes:
      - name: config
        configMap:
          name: pgbouncer-config-v2
      - name: users
        secret:
          secretName: pgbouncer-users-v2
---
# ==========================================
# 2. REDIS (原本的 mode: global)
# ==========================================
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: redis
  namespace: default
spec:
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      hostNetwork: true 
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
      containers:
      - name: redis
        image: redis:7-alpine
        command: ["redis-server", "/etc/redis/redis.conf"]
        env:
        - name: TZ
          value: "Asia/Hong_Kong"
        volumeMounts:
        - name: config
          mountPath: /etc/redis/redis.conf
          subPath: redis.conf
        - name: tz
          mountPath: /etc/localtime
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: redis-config-v2
      - name: tz
        hostPath:
          path: /etc/localtime
---
# ==========================================
# 3. WAF (Caddy + Coraza，原本的 mode: global)
# ==========================================
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: waf
  namespace: default
spec:
  selector:
    matchLabels:
      app: waf
  template:
    metadata:
      labels:
        app: waf
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
      containers:
      - name: waf
        image: my-local-caddy-coraza:latest
        imagePullPolicy: Never
        resources:
          limits:
            cpu: "2.0"
            memory: 2Gi
          requests:
            cpu: "0.5"
            memory: 512Mi
        env:
        - name: TZ
          value: "Asia/Hong_Kong"
        volumeMounts:
        - name: config
          mountPath: /etc/caddy/Caddyfile
          subPath: Caddyfile
        - name: tz
          mountPath: /etc/localtime
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: caddy-config-v7
      - name: tz
        hostPath:
          path: /etc/localtime
---
# ==========================================
# 4. APP (Next.js Standalone 進化版 Deployment)
# ==========================================
apiVersion: apps/v1
kind: Deployment # 👈 關鍵 1：改為 Deployment，解鎖自由調整 Pod 數量的限制
metadata:
  name: app
  namespace: default
spec:
  replicas: 4 # 👈 關鍵 2：直接填入您想要的總 Pod 數。2台 Worker 就會自動跑 2+2=4 個 Pod
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      hostNetwork: false # 👈 關鍵 3：必須關閉主機網路！改走 K8s 虛擬網路，同主機的多個 Pod 才不會互撞 Port 3000
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist # 絕對不去 Master
      
      # 👈 關鍵 4：拓撲均勻分佈核心！強迫 4 個 Pod 必須絕對平均、對稱地落入 2 台 Worker 裡（2+2）
      topologySpreadConstraints:
      - maxSkew: 1                           # 兩台主機的 Pod 數量相差絕對不能超過 1
        topologyKey: kubernetes.io/hostname   # 以主機名稱作為分配維度
        whenUnsatisfiable: DoNotSchedule      # 硬性限制，分不平寧可不啟動，確保「各別鎖死同一台」
        labelSelector:
          matchLabels:
            app: app

      hostAliases:
      - ip: "172.17.0.1" # 👈 關鍵 5：K3s 預設宿主機網閘，讓躲在虛擬網路的 Next.js 能連同機實體平面的 Redis
        hostnames:
        - "redis"
      - ip: "10.99.99.1"
        hostnames:
        - "postgres"
      containers:
      - name: app
        image: docker.io/library/new-app:latest 
        imagePullPolicy: Never                  
        ports:
        - containerPort: 3000
        resources:
          limits:
            cpu: "1"
            memory: 1Gi
          requests:
            cpu: 500m
            memory: 512Mi
        env:
        - name: TZ
          value: "Asia/Hong_Kong"
        - name: NODE_OPTIONS
          value: "--max-old-space-size=768"
        - name: NODE_ENV
          value: "production"
        - name: REDIS_HOST
          value: "redis"
        - name: REDIS_PORT
          value: "6379"
        - name: REDIS_DB
          value: "0"
        - name: HOSTNAME
          value: "0.0.0.0" # 👈 對應您的 server.js：讓 Next.js 接受來自外部（WAF）的連線
        - name: PORT
          value: "3000"    # 👈 對應您的 server.js：保持預設 3000，完全不用動程式碼！
        readinessProbe:
          exec:
            command: ["/nodejs/bin/node", "-e", "require('net').createConnection(3000, '127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
          periodSeconds: 10
          timeoutSeconds: 3
        volumeMounts:
        - name: env-file
          mountPath: /run/secrets/env_v1
          subPath: env_v1
        - name: tz
          mountPath: /etc/localtime
          readOnly: true
      volumes:
      - name: env-file
        secret:
          secretName: env-v6
          items:
          - key: env_v1
            path: env_v1
      - name: tz
        hostPath:
          path: /etc/localtime

---
# ==========================================
# 4.1 APP 專屬「零損耗」Headless Service
# ==========================================
apiVersion: v1
kind: Service
metadata:
  name: app-headless
  namespace: default
spec:
  clusterIP: None # 👈 關鍵：設定為 None，徹底拔除 K8s 網路層的效能損耗！
  selector:
    app: app
  ports:
  - protocol: TCP
    port: 3000
    targetPort: 3000
  internalTrafficPolicy: Local # 👈 關鍵鎖死：Caddy 查 DNS 時，K3s 只會回傳「目前這台機器上」的 Pod IP，絕不跨機
