# ==========================================
# 1. PGBOUNCER (原本的 mode: global)
# ==========================================
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: pgbouncer
  namespace: default
spec:
  selector:
    matchLabels:
      app: pgbouncer
  template:
    metadata:
      labels:
        app: pgbouncer
    spec:
      hostNetwork: true # 👈 關鍵：對應 mode: host，直接綁定在實體機的 6432
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist # 👈 關鍵：絕對不去 Master，只去 Worker
      containers:
      - name: pgbouncer
        image: edoburu/pgbouncer:latest
        resources:
          limits:
            cpu: "1.0"
            memory: 256Mi
        securityContext:
          capabilities:
            add: ["SYS_RESOURCE"] # 允許提高 ulimits
        volumeMounts:
        - name: config
          mountPath: /etc/pgbouncer/pgbouncer.ini
          subPath: pgbouncer.ini
        - name: users
          mountPath: /etc/pgbouncer/userlist.txt
          subPath: userlist.txt
      volumes:
      - name: config
        configMap:
          name: pgbouncer-config-v2
      - name: users
        secret:
          secretName: pgbouncer-users-v2
---
# ==========================================
# 2. REDIS (原本的 mode: global)
# ==========================================
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: redis
  namespace: default
spec:
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      hostNetwork: true # 👈 關鍵修正：Swarm 轉 K8s 漏掉這行會使 App 找不到實體機上的 Redis
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
      containers:
      - name: redis
        image: redis:7-alpine
        command: ["redis-server", "/etc/redis/redis.conf"]
        env:
        - name: TZ
          value: "Asia/Hong_Kong"
        volumeMounts:
        - name: config
          mountPath: /etc/redis/redis.conf
          subPath: redis.conf
        - name: tz
          mountPath: /etc/localtime
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: redis-config-v2
      - name: tz
        hostPath:
          path: /etc/localtime
---
# ==========================================
# 3. WAF (Caddy + Coraza，原本的 mode: global)
# ==========================================
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: waf
  namespace: default
spec:
  selector:
    matchLabels:
      app: waf
  template:
    metadata:
      labels:
        app: waf
    spec:
      hostNetwork: true # 👈 關鍵：保持 Host 模式，確保精準抓到真實 IP
      dnsPolicy: ClusterFirstWithHostNet
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
      containers:
      - name: waf
        image: my-local-caddy-coraza:latest
        imagePullPolicy: Never
        resources:
          limits:
            cpu: "2.0"
            memory: 2Gi
          requests:
            cpu: "0.5"
            memory: 512Mi
        env:
        - name: TZ
          value: "Asia/Hong_Kong"
        volumeMounts:
        - name: config
          mountPath: /etc/caddy/Caddyfile
          subPath: Caddyfile
        - name: tz
          mountPath: /etc/localtime
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: caddy-config-v7
      - name: tz
        hostPath:
          path: /etc/localtime
---
# ==========================================
# 4. APP (原本的 replicated 模式 -> Deployment)
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: default
spec:
  replicas: 2 # 💡 未來擴展至 8 個 Pod 時直接修改此處即可，完全不卡連接埠
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1        # 先開一個新 Pod
      maxUnavailable: 0  # 舊的不能先關，確保更新時流量不中斷
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist # 絕對不去 Master，只去 Worker 節點
      # 💡 內聯 DNS：利用動態環境變數，自動對接本機實體 IP
      hostAliases:
      - ip: "127.0.0.1" 
        hostnames:
        - "postgres" # 對應主機網路上的 Pgbouncer
      containers:
      - name: app
        image: docker.io/library/new-app:latest 
        imagePullPolicy: Never                  
        resources:
          limits:
            cpu: "1"
            memory: 1Gi
          requests:
            cpu: 500m
            memory: 512Mi
        env:
        - name: TZ
          value: "Asia/Hong_Kong"
        - name: NODE_OPTIONS
          value: "--max-old-space-size=768"
        - name: NODE_ENV
          value: "production"
          
        # 👈 專家級修正 1：動態獲取當前 Pod 所在的實體 Worker 機器的內網 IP
        - name: K8S_NODE_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP

        # 👈 專家級修正 2：利用剛拿到的實體機 IP 覆蓋 Swarm 時代的 127.0.0.1 舊寫法
        - name: REDIS_HOST
          value: "$(K8S_NODE_IP)"
        - name: REDIS_PORT
          value: "6379"
        - name: REDIS_DB
          value: "0"
          
        # 👈 專家級修正 3：擴大 Node.js 框架監聽範圍，允許 K8s 內部網卡流量打入
        - name: HOST
          value: "0.0.0.0"
        - name: PORT
          value: "3000"
          
        # 完美綁定您的 Node.js 健康檢查機制
        readinessProbe:
          exec:
            command: ["/nodejs/bin/node", "-e", "require('net').createConnection(3000).on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
          periodSeconds: 10
          timeoutSeconds: 3
        volumeMounts:
        - name: env-file
          mountPath: /app/.env 
          subPath: env_v1
        - name: tz
          mountPath: /etc/localtime
          readOnly: true
      volumes:
      - name: env-file
        secret:
          secretName: env-v6
      - name: tz
        hostPath:
          path: /etc/localtime
---
# ==========================================
# 5. SERVICE (鎖死跨節點流量，流量在地化)
# ==========================================
apiVersion: v1
kind: Service
metadata:
  name: app-service
  namespace: default
spec:
  clusterIP: None                # 👈 外部完全碰不到 3000，安全性 100%
  internalTrafficPolicy: Local   # ──► 核心關鍵：WAF 呼叫此 Service 時，絕對只會分流給本機的 8 個 Pod，絕不跨機
  selector:
    app: app
  ports:
    - protocol: TCP
      port: 3000                 
      targetPort: 3000           
