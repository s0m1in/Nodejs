# ==========================================
# 1. PGBOUNCER (原本的 mode: global)
# ==========================================
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: pgbouncer
  namespace: default
spec:
  selector:
    matchLabels:
      app: pgbouncer
  template:
    metadata:
      labels:
        app: pgbouncer
    spec:
      hostNetwork: true
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
      containers:
      - name: pgbouncer
        image: edoburu/pgbouncer:latest
        resources:
          limits:
            cpu: "1.0"
            memory: 256Mi
        securityContext:
          capabilities:
            add: ["SYS_RESOURCE"]
        volumeMounts:
        - name: config
          mountPath: /etc/pgbouncer/pgbouncer.ini
          subPath: pgbouncer.ini
        - name: users
          mountPath: /etc/pgbouncer/userlist.txt
          subPath: userlist.txt
      volumes:
      - name: config
        configMap:
          name: pgbouncer-config-v2
      - name: users
        secret:
          secretName: pgbouncer-users-v2
---
# ==========================================
# 2. REDIS (原本的 mode: global)
# ==========================================
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: redis
  namespace: default
spec:
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      hostNetwork: true 
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
      containers:
      - name: redis
        image: redis:7-alpine
        command: ["redis-server", "/etc/redis/redis.conf"]
        env:
        - name: TZ
          value: "Asia/Hong_Kong"
        volumeMounts:
        - name: config
          mountPath: /etc/redis/redis.conf
          subPath: redis.conf
        - name: tz
          mountPath: /etc/localtime
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: redis-config-v2
      - name: tz
        hostPath:
          path: /etc/localtime
---
# ==========================================
# 3. WAF (Caddy + Coraza，原本的 mode: global)
# ==========================================
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: waf
  namespace: default
spec:
  selector:
    matchLabels:
      app: waf
  template:
    metadata:
      labels:
        app: waf
    spec:
      hostNetwork: true # 👈 WAF 保持 Host 模式，免除 K3s 權限限制，完美合法監聽實體外網 80/8080 埠
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
      containers:
      - name: waf
        image: my-local-caddy-coraza:latest
        imagePullPolicy: Never
        resources:
          limits:
            cpu: "2.0"
            memory: 2Gi
          requests:
            cpu: "0.5"
            memory: 512Mi
        env:
        - name: TZ
          value: "Asia/Hong_Kong"
        volumeMounts:
        - name: config
          mountPath: /etc/caddy/Caddyfile
          subPath: Caddyfile
        - name: tz
          mountPath: /etc/localtime
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: caddy-config-v7
      - name: tz
        hostPath:
          path: /etc/localtime
---
# ==========================================
# 4. APP (正宗 K8s 水平擴充 Deployment，無 PM2 單點故障)
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: default
spec:
  replicas: 2 # 💡 未來擴展至 8 個、16 個 Pod 直接修改此處即可，享有 K8s 原生最高級別防護與水平擴充！
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1        # 先開一個新 Pod
      maxUnavailable: 0  # 舊的不能先關，確保更新時流量不中斷
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      # 💡 拿掉 hostNetwork，回歸 K8s 標準平面，多個 Pod 同時聽 3000 埠絕對不搶 Ports
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist # 絕對不去 Master，只去 Worker 節點
      hostAliases:
      - ip: "127.0.0.1" 
        hostnames:
        - "postgres" # 對應主機網路上的 Pgbouncer
      containers:
      - name: app
        image: docker.io/library/new-app:latest 
        imagePullPolicy: Never                  
        resources:
          limits:
            cpu: "1"
            memory: 1Gi
          requests:
            cpu: 500m
            memory: 512Mi
        env:
        - name: TZ
          value: "Asia/Hong_Kong"
        - name: NODE_OPTIONS
          value: "--max-old-space-size=768"
        - name: NODE_ENV
          value: "production"
        - name: K8S_NODE_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: REDIS_HOST
          value: "$(K8S_NODE_IP)" # 自動連接當前節點實體機上的 Redis
        - name: REDIS_PORT
          value: "6379"
        - name: REDIS_DB
          value: "0"
        - name: HOST
          value: "0.0.0.0" # 擴大監聽範圍，接收來自 Service NodePort 的流量
        - name: PORT
          value: "3000"
        readinessProbe:
          exec:
            command: ["/nodejs/bin/node", "-e", "require('net').createConnection(3000).on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
          periodSeconds: 10
          timeoutSeconds: 3
        volumeMounts:
        - name: env-file
          mountPath: /app/.env 
          subPath: env_v1
        - name: tz
          mountPath: /etc/localtime
          readOnly: true
      volumes:
      - name: env-file
        secret:
          secretName: env-v6
      - name: tz
        hostPath:
          path: /etc/localtime
---
# ==========================================
# 5. SERVICE (正宗 K8s NodePort 鋼鐵在地化通路)
# ==========================================
apiVersion: v1
kind: Service
metadata:
  name: app-service
  namespace: default
spec:
  type: NodePort                 
  externalTrafficPolicy: Local   # ──► 核心關鍵：外部（包含HostNetwork WAF）從實體埠進來時，強制不跨機轉發！只給本機的這群 App Pod，100% 橫向流量鎖死！
  selector:
    app: app
  ports:
    - protocol: TCP
      port: 3000                 
      targetPort: 3000           
      nodePort: 30000            # 👈 固定實體主機轉發通道，避開所有網域與環境變數解析亂源
