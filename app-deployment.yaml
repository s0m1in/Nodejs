# ==========================================
# 1. PGBOUNCER (原本的 mode: global)
# ==========================================
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: pgbouncer
  namespace: default
spec:
  selector:
    matchLabels:
      app: pgbouncer
  template:
    metadata:
      labels:
        app: pgbouncer
    spec:
      hostNetwork: true
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
      containers:
      - name: pgbouncer
        image: edoburu/pgbouncer:latest
        resources:
          limits:
            cpu: "1.0"
            memory: 256Mi
        securityContext:
          capabilities:
            add: ["SYS_RESOURCE"]
        volumeMounts:
        - name: config
          mountPath: /etc/pgbouncer/pgbouncer.ini
          subPath: pgbouncer.ini
        - name: users
          mountPath: /etc/pgbouncer/userlist.txt
          subPath: userlist.txt
      volumes:
      - name: config
        configMap:
          name: pgbouncer-config-v2
      - name: users
        secret:
          secretName: pgbouncer-users-v2
---
# ==========================================
# 2. REDIS (原本的 mode: global)
# ==========================================
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: redis
  namespace: default
spec:
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      hostNetwork: true 
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
      containers:
      - name: redis
        image: redis:7-alpine
        command: ["redis-server", "/etc/redis/redis.conf"]
        env:
        - name: TZ
          value: "Asia/Hong_Kong"
        volumeMounts:
        - name: config
          mountPath: /etc/redis/redis.conf
          subPath: redis.conf
        - name: tz
          mountPath: /etc/localtime
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: redis-config-v2
      - name: tz
        hostPath:
          path: /etc/localtime
---
# ==========================================
# 3. WAF (Caddy + Coraza，原本的 mode: global)
# ==========================================
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: waf
  namespace: default
spec:
  selector:
    matchLabels:
      app: waf
  template:
    metadata:
      labels:
        app: waf
    spec:
      hostNetwork: true # 免特權合法聽在實體機 80/8080 埠
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
      containers:
      - name: waf
        image: my-local-caddy-coraza:latest
        imagePullPolicy: Never
        resources:
          limits:
            cpu: "2.0"
            memory: 2Gi
          requests:
            cpu: "0.5"
            memory: 512Mi
        env:
        - name: TZ
          value: "Asia/Hong_Kong"
        # 👈 終極解法：利用 K8s 內建機制，直接把動態的 Service ClusterIP 轉為大寫環境變數注入 Caddy！
        - name: K8S_APP_SERVICE_IP
          value: app-service.default.svc.cluster.local
        volumeMounts:
        - name: config
          mountPath: /etc/caddy/Caddyfile
          subPath: Caddyfile
        - name: tz
          mountPath: /etc/localtime
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: caddy-config-v7
      - name: tz
        hostPath:
          path: /etc/localtime
---
# ==========================================
# 4. APP (原本的 replicated 模式 -> Deployment)
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: default
spec:
  replicas: 2 # 💡 未來擴展至 8 個 Pod 時直接修改此處即可，完全不卡連接埠
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1        # 先開一個新 Pod
      maxUnavailable: 0  # 舊的不能先關，確保更新時流量不中斷
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist # 絕對不去 Master，只去 Worker 節點
      hostAliases:
      - ip: "127.0.0.1" 
        hostnames:
        - "postgres" # 對應主機網路上的 Pgbouncer
      containers:
      - name: app
        image: docker.io/library/new-app:latest 
        imagePullPolicy: Never                  
        resources:
          limits:
            cpu: "1"
            memory: 1Gi
          requests:
            cpu: 500m
            memory: 512Mi
        env:
        - name: TZ
          value: "Asia/Hong_Kong"
        - name: NODE_OPTIONS
          value: "--max-old-space-size=768"
        - name: NODE_ENV
          value: "production"
        - name: K8S_NODE_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: REDIS_HOST
          value: "$(K8S_NODE_IP)" # 動態對接本機 Redis
        - name: REDIS_PORT
          value: "6379"
        - name: REDIS_DB
          value: "0"
        - name: HOST
          value: "0.0.0.0" # 擴大監聽範圍，接收 Service 流量
        - name: PORT
          value: "3000"
        readinessProbe:
          exec:
            command: ["/nodejs/bin/node", "-e", "require('net').createConnection(3000).on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
          periodSeconds: 10
          timeoutSeconds: 3
        volumeMounts:
        - name: env-file
          mountPath: /app/.env 
          subPath: env_v1
        - name: tz
          mountPath: /etc/localtime
          readOnly: true
      volumes:
      - name: env-file
        secret:
          secretName: env-v6
      - name: tz
        hostPath:
          path: /etc/localtime
---
# ==========================================
# 5. SERVICE (回歸常規虛擬 IP，不跨節點流量)
# ==========================================
apiVersion: v1
kind: Service
metadata:
  name: app-service
  namespace: default
spec:
  type: ClusterIP                # 👈 改回常規模式，徹底終結 None Service 導致 Caddyfile 讀不出 Port 的通病
  internalTrafficPolicy: Local   # ──► 核心防線：流量絕對鎖死在本機！絕不跨機
  selector:
    app: app
  ports:
    - protocol: TCP
      port: 3000                 
      targetPort: 3000           
