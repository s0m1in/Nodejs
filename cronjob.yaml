apiVersion: batch/v1
kind: CronJob
metadata:
  name: telegram-hourly
  namespace: default
spec:
  schedule: "0 * * * *" # 每小時執行一次
  timeZone: "Asia/Taipei"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          hostAliases:
          - ip: "10.99.99.1"
            hostnames:
            - "postgres"
          containers:
          - name: report
            image: docker.io/library/new-app:latest
            imagePullPolicy: Never
            command: ["/nodejs/bin/node", "/app/scripts/entrypoint.js", "/nodejs/bin/node", "/app/scripts/telegram-report.js", "hourly"]
            volumeMounts:
            - name: env-file
              # 💡 👑 唯一精準修正：只改這行路徑！把檔案精準投遞到 entrypoint.js 死等的 Swarm 原生絕對路徑上！
              # 這樣一開機它就能成功認出並讀取名為 env_v1 的檔案，自動去引號解鎖變數，直通 Prisma！
              mountPath: /run/secrets/env_v1
              subPath: env_v1
          volumes:
          - name: env-file
            secret:
              secretName: env-v6
---
apiVersion: batch/v1
kind: CronJob
metadata:
