          - ip: "10.99.99.1"
            hostnames:
            - "postgres"
          containers:
          - name: report
            image: docker.io/library/new-app:latest
            imagePullPolicy: Never
            command: ["/nodejs/bin/node", "/app/scripts/entrypoint.js", "/nodejs/bin/node", "/app/scripts/telegram-report.js", "daily"]
            volumeMounts:
            - name: env-file
              # 💡 👑 唯一精準修正：只改這行路徑
              mountPath: /run/secrets/env_v1
